<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neil Control</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel2: #1e232b; --line: #2a313b;
    --text: #e6e9ee; --muted: #8b95a3; --accent: #4ea1ff; --ok: #3ccf7a; --warn: #f2b33d;
    --bad: #ff5a5a; --drive: #ff7a2f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .pill { padding: 3px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line);
          font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.ok { border-color: #2a6a46; } .pill.ok::before { content: "● "; color: var(--ok); }
  .pill.bad { border-color: #7a2c2c; } .pill.bad::before { content: "● "; color: var(--bad); }
  .pill.wait::before { content: "● "; color: var(--warn); }
  .pill.off::before { content: "● "; color: #555; }
  .pill.drive { border-color: var(--drive); color: var(--drive); font-weight: 700; }
  #estop { background: var(--bad); color: #fff; border: 3px solid #ffb3b3; border-radius: 12px;
           font-size: 20px; font-weight: 800; letter-spacing: 1px; padding: 12px 26px; cursor: pointer;
           box-shadow: 0 0 0 0 rgba(255,90,90,.6); }
  #estop:hover { filter: brightness(1.1); }
  #estop:active { transform: scale(.97); }
  #estop small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .3px; opacity: .85; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; padding: 14px 16px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .cams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 700px) { .cams { grid-template-columns: 1fr; } }
  .cam { background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: relative;
         aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .label { position: absolute; left: 8px; top: 6px; font-size: 12px; background: rgba(0,0,0,.6);
                padding: 2px 8px; border-radius: 6px; }
  .cam .none { color: var(--muted); position: absolute; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  section h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 650; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input, select, textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
                            border-radius: 6px; padding: 6px 8px; font: inherit; }
  input[type=checkbox] { width: auto; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
           padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.go { background: var(--ok); border-color: var(--ok); color: #062; font-weight: 700; font-size: 16px; padding: 10px; }
  button.go.drive { background: var(--drive); border-color: var(--drive); color: #fff; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; background: var(--panel2); padding: 8px; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 650; }
  .seg button.on.drive { background: var(--drive); }
  .motors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .motors div { background: var(--panel2); border-radius: 8px; padding: 6px 4px; }
  .motors .v { font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .motors .n { font-size: 11px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .warn { color: var(--warn); } .bad { color: var(--bad); } .okc { color: var(--ok); }
  .live { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .live .cell { background: var(--panel2); border-radius: 8px; padding: 8px; }
  .live .n { font-size: 11px; color: var(--muted); }
  .live .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .live .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  canvas { width: 100%; height: 140px; display: block; margin-top: 10px; background: var(--panel2); border-radius: 8px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .log { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); max-height: 140px; overflow: auto; white-space: pre-wrap; }
  .banner { padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; font-weight: 600; }
  .banner.drive { background: rgba(255,122,47,.15); border: 1px solid var(--drive); color: var(--drive); }
  .banner.dry { background: rgba(78,161,255,.12); border: 1px solid #2d5f99; color: var(--accent); }
  .banner.stop { background: rgba(255,90,90,.15); border: 1px solid var(--bad); color: var(--bad); }
  .caps { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Neil · VLA</h1>
  <div class="pills" id="pills"></div>
  <button id="estop" title="Space or Esc">EMERGENCY STOP<small>Space / Esc</small></button>
</header>

<main>
  <div>
    <div id="banner"></div>
    <div class="cams">
      <div class="cam"><span class="none" id="none-pi">Pi camera not connected</span>
        <img id="img-pi" alt=""><span class="label">Front · Pi (camera1)</span></div>
      <div class="cam"><span class="none" id="none-external">iPhone not connected</span>
        <img id="img-external" alt=""><span class="label">Top · iPhone (camera2)</span></div>
    </div>

    <section style="margin-top:12px">
      <h2>Model output</h2>
      <div class="live" id="live"></div>
      <div class="stats" id="stats"></div>
      <canvas id="chart" width="900" height="140"></canvas>
      <div class="legend" id="legend"></div>
    </section>

    <section>
      <h2>Log</h2>
      <div class="log" id="log"></div>
    </section>
  </div>

  <div>
    <section>
      <h2>Robot</h2>
      <div class="motors" id="motors"></div>
      <div class="hint" id="pose-hint"></div>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="connect">Connect</button>
        <button id="disconnect">Disconnect</button>
      </div>
      <div class="hint" id="robot-hint">Connect reads both cameras and the motors (read-only). Disconnect frees them for the gamepad or the recorder.</div>
    </section>

    <section>
      <h2>Model</h2>
      <label>Checkpoint</label>
      <select id="ckpt"></select>
      <div class="row">
        <div><label>Device</label><select id="device"><option>mps</option><option>cpu</option><option>cuda</option></select></div>
        <div><label>Port</label><input id="mport" type="number" value="8001"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="mstart">Start server</button>
        <button id="mstop">Stop server</button>
      </div>
      <details><summary>Or use a server that is already running</summary>
        <div class="row" style="margin-top:6px"><input id="murl" value="http://127.0.0.1:8000"><button id="muse" style="flex:0 0 auto">Use</button></div>
      </details>
      <div class="hint" id="model-info"></div>
    </section>

    <section>
      <h2>Run</h2>
      <div class="seg" id="modeSeg">
        <button data-v="dry" class="on">Dry run (log only)</button>
        <button data-v="drive" class="drive">Drive Neil</button>
      </div>
      <label>Task</label>
      <input id="task" value="pick up the cup">
      <label>Observation spec</label>
      <select id="spec"></select>
      <div class="row">
        <div><label>Chunks</label><select id="rmode"><option value="async">async (keep moving)</option><option value="sync">sync (pause each chunk)</option></select></div>
        <div><label>Stop after (s, empty = never)</label><input id="seconds" type="number" value="30" min="1"></div>
      </div>
      <label>Caps (applied to every command; also in dry run)</label>
      <div class="caps">
        <div><label><input type="checkbox" id="c-wheels" checked> wheels</label></div>
        <div><label><input type="checkbox" id="c-arm_grip" checked> arm + gripper</label></div>
        <div><label>Wheel speed cap (0-30)</label><input id="c-wheel_cap" type="number" min="0" max="30"></div>
        <div></div>
        <div><label>Arm target min / max (°)</label><div class="row"><input id="c-arm_min" type="number"><input id="c-arm_max" type="number"></div></div>
        <div><label>Gripper target min / max (°)</label><div class="row"><input id="c-grip_min" type="number"><input id="c-grip_max" type="number"></div></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="go" id="start">Start dry run</button>
        <button id="stop" style="flex:0 0 90px">Stop</button>
      </div>
      <div class="hint" id="run-hint"></div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const COLORS = ["#4ea1ff", "#3ccf7a", "#f2b33d", "#e46cf0"];
const NAMES = ["left", "right", "arm", "grip"];
let S = null, opts = null, driveMode = false, capsDirty = false;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok || j.error) { alert(j.error || r.statusText); throw new Error(j.error); }
  return j;
}

function estop() { fetch("/api/estop", {method: "POST", body: "{}"}); }
$("estop").onclick = estop;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" || (e.key === " " && !["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName))) {
    e.preventDefault(); estop();
  }
});

$("connect").onclick = () => api("/api/connect", {});
$("disconnect").onclick = () => api("/api/disconnect", {});
$("mstart").onclick = () => api("/api/model/start", {checkpoint: $("ckpt").value, device: $("device").value, port: +$("mport").value});
$("mstop").onclick = () => api("/api/model/stop", {});
$("muse").onclick = () => api("/api/model/use", {url: $("murl").value});
$("stop").onclick = () => api("/api/run/stop", {});

for (const b of $("modeSeg").children) b.onclick = () => {
  driveMode = b.dataset.v === "drive";
  for (const x of $("modeSeg").children) x.classList.toggle("on", x === b);
  $("start").textContent = driveMode ? "Start driving" : "Start dry run";
  $("start").classList.toggle("drive", driveMode);
};

function caps() {
  const c = {wheels: $("c-wheels").checked, arm_grip: $("c-arm_grip").checked};
  for (const k of ["wheel_cap", "arm_min", "arm_max", "grip_min", "grip_max"]) c[k] = +$("c-" + k).value;
  return c;
}
for (const k of ["wheels", "arm_grip", "wheel_cap", "arm_min", "arm_max", "grip_min", "grip_max"]) {
  $("c-" + k).onchange = () => { capsDirty = false; api("/api/caps", caps()).catch(() => {}); };
  $("c-" + k).oninput = () => { capsDirty = true; };
}

$("start").onclick = async () => {
  if (driveMode) {
    const c = caps();
    const msg = "Neil WILL MOVE.\n\n" +
      `Wheels: ${c.wheels ? "on, speed at most " + c.wheel_cap : "off"}\n` +
      `Arm + gripper: ${c.arm_grip ? `on, arm ${c.arm_min}..${c.arm_max}°, gripper ${c.grip_min}..${c.grip_max}°` : "off"}\n\n` +
      "Stay next to Neil, keep hands clear of the arm, and keep this page open (closing it stops Neil).\n" +
      "Space or Esc = emergency stop.\n\nStart?";
    if (!confirm(msg)) return;
  }
  await api("/api/run/start", {drive: driveMode, task: $("task").value, spec: $("spec").value, mode: $("rmode").value,
                              seconds: $("seconds").value, caps: caps()});
};

function pill(text, cls) { return `<span class="pill ${cls}">${text}</span>`; }
function cls(status) {
  if (!status || status === "off" || status === "none" || status === "stopped") return "off";
  if (status.startsWith("error")) return "bad";
  if (status.startsWith("on") || status === "ready") return "ok";
  return "wait";
}
const fmt = (v, d = 1) => v === null || v === undefined ? "–" : (+v).toFixed(d);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

function render() {
  const s = S, run = s.run, active = s.running;
  // header
  let p = pill(`Pi cam <b>${esc(s.cams.pi.status)}</b>`, cls(s.cams.pi.status)) +
          pill(`iPhone <b>${esc(s.cams.external.status)}</b>`, cls(s.cams.external.status)) +
          pill(`Motors <b>${esc(s.motors.status)}</b>`, cls(s.motors.status)) +
          pill(`Model <b>${esc(s.model.status)}</b>`, cls(s.model.status));
  if (s.replay) p += pill(`replay <b>${esc(s.replay)}</b>`, "wait");
  if (active && run.drive) p += pill("DRIVING", "drive");
  $("pills").innerHTML = p;

  // cameras: (re)attach the stream when a camera comes up
  for (const n of ["pi", "external"]) {
    const on = s.cams[n].status.startsWith("on"), img = $("img-" + n);
    if (on && !img.dataset.on) { img.src = `/stream/${n}?t=${Date.now()}`; img.dataset.on = "1"; }
    if (!on && img.dataset.on) { img.removeAttribute("src"); delete img.dataset.on; }
    $("none-" + n).textContent = on ? "" : (n === "pi" ? "Pi camera " : "iPhone ") + s.cams[n].status;
  }

  // banner
  let b = "";
  if (run && run.estopped) b = `<div class="banner stop">EMERGENCY STOP pressed${active ? ": stopping" : ""}.</div>`;
  else if (active && run.drive) b = `<div class="banner drive">DRIVING NEIL · ${esc(run.status)} · ${fmt(run.elapsed)} s${run.seconds ? " / " + run.seconds + " s" : ""}</div>`;
  else if (active) b = `<div class="banner dry">Dry run · ${esc(run.status)} · nothing moves · ${fmt(run.elapsed)} s${run.seconds ? " / " + run.seconds + " s" : ""}</div>`;
  $("banner").innerHTML = b;

  // motors
  const r = s.motors.robot || {};
  $("motors").innerHTML = [["left", "left wheel"], ["right", "right wheel"], ["arm", "arm °"], ["grip", "gripper °"]]
    .map(([k, n]) => `<div><div class="v">${fmt(r[k], 0)}</div><div class="n">${n}</div></div>`).join("");
  let hint = "";
  if (r.arm != null && !active) {
    const armOk = r.arm >= -5 && r.arm <= 8, gripOk = r.grip >= -14 && r.grip <= -8;
    hint = armOk && gripOk ? `<span class="okc">Start pose matches the recordings.</span>`
      : `<span class="warn">Recordings started with arm -5..8 and gripper -14..-8.</span>`;
  }
  $("pose-hint").innerHTML = (hint ? hint + " " : "") + "Robot terms: + forward / arm down / gripper open.";
  $("connect").disabled = !!s.busy || active;
  $("disconnect").disabled = !!s.busy || active;
  $("robot-hint").textContent = s.busy ? s.busy + " ..." : "Connect reads both cameras and the motors (read-only). Disconnect frees them for the gamepad or the recorder.";

  // model
  const m = s.model;
  let mi = `<b>${esc(m.url)}</b> · ${esc(m.status)}`;
  if (m.info) mi += `<br>${esc(m.info.policy)} on ${esc(m.info.device)} · ${m.info.chunk_size} actions × ${m.info.action_dim} values` +
                    (m.checkpoint ? `<br>${esc(m.checkpoint)}` : "");
  if (m.status === "loading" && m.log_tail) mi += `<br><span class="log">${esc(m.log_tail)}</span>`;
  if (m.error) mi += `<br><span class="bad">${esc(m.error)}</span>`;
  $("model-info").innerHTML = mi;
  $("mstart").disabled = active; $("mstop").disabled = active || !m.managed;

  // caps (don't overwrite while the user types)
  if (!capsDirty && document.activeElement?.id?.startsWith("c-") !== true) {
    for (const k of ["wheel_cap", "arm_min", "arm_max", "grip_min", "grip_max"]) $("c-" + k).value = s.caps[k];
    $("c-wheels").checked = s.caps.wheels; $("c-arm_grip").checked = s.caps.arm_grip;
  }

  // run controls
  const ready = m.status === "ready" && s.motors.status.startsWith("on") && !s.busy;
  $("start").disabled = active || !ready;
  $("stop").disabled = !active;
  for (const x of $("modeSeg").children) x.disabled = active || (x.dataset.v === "drive" && !!s.replay);
  let rh = !ready && !active ? "Connect the robot and start (or pick) a model server first." : "";
  if (run) {
    if (run.error) rh += `<span class="bad">${esc(run.error)}</span><br>`;
    for (const w of run.warnings || []) rh += `<span class="warn">${esc(w)}</span><br>`;
    if (run.out_dir) rh += `Saved to ${esc(run.out_dir)}`;
  }
  $("run-hint").innerHTML = rh;

  // live output
  const a = run && run.action, c = run && run.command;
  $("live").innerHTML = NAMES.map((n, i) => {
    const cmdKey = i < 2 ? n : n + "_pos";
    const cv = c ? c[cmdKey] : undefined;
    return `<div class="cell"><div class="n" style="color:${COLORS[i]}">${(run && run.action_names[i]) || n}</div>
      <div class="v">${a ? fmt(a[i]) : "–"}</div>
      <div class="c">${c ? (cv === undefined ? "→ hold" : "→ " + fmt(cv, i < 2 ? 0 : 1)) + (run.drive ? " sent" : " (dry)") : "&nbsp;"}</div></div>`;
  }).join("");
  $("stats").innerHTML = run ? [
    ["step", run.step ?? "–"], ["chunks", run.chunks], ["queued", run.queued + (run.in_flight ? " + asking" : "")],
    ["round trip", run.latency_ms != null ? run.latency_ms + " ms" : "–"],
    ["median", run.latency_median_ms != null ? run.latency_median_ms + " ms" : "–"],
    ["errors", run.errors]].map(([k, v]) => `${k} <b>${v}</b>`).join("") +
    (run.last_error ? `<span class="bad">${esc(run.last_error.slice(0, 160))}</span>` : "") +
    (run.obs_error ? `<span class="warn">${esc(run.obs_error)}</span>` : "") : "";
  drawChart(run ? run.history : []);

  $("log").textContent = s.messages.map(x => `${x.t}  ${x.msg}`).reverse().join("\n");
}

function drawChart(hist) {
  const cv = $("chart"), ctx = cv.getContext("2d"), W = cv.width = cv.clientWidth * devicePixelRatio,
        H = cv.height = cv.clientHeight * devicePixelRatio;
  ctx.clearRect(0, 0, W, H);
  const vals = hist.filter(Boolean).flat();
  if (!vals.length) return;
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi - lo < 1) { hi += .5; lo -= .5; }
  const pad = 8 * devicePixelRatio, y = v => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad), x = i => i / 99 * W;
  ctx.strokeStyle = "#2a313b"; ctx.lineWidth = devicePixelRatio;
  ctx.beginPath(); ctx.moveTo(0, y(0)); ctx.lineTo(W, y(0)); ctx.stroke();
  ctx.fillStyle = "#8b95a3"; ctx.font = `${11 * devicePixelRatio}px sans-serif`;
  ctx.fillText(hi.toFixed(0), 4, pad + 10 * devicePixelRatio); ctx.fillText(lo.toFixed(0), 4, H - pad);
  const off = 100 - hist.length;
  for (let d = 0; d < 4; d++) {
    ctx.strokeStyle = COLORS[d]; ctx.lineWidth = 2 * devicePixelRatio; ctx.beginPath();
    let pen = false;
    hist.forEach((a, i) => {
      if (!a) { pen = false; return; }
      pen ? ctx.lineTo(x(i + off), y(a[d])) : ctx.moveTo(x(i + off), y(a[d])); pen = true;
    });
    ctx.stroke();
  }
}

async function init() {
  opts = await api("/api/options");
  $("ckpt").innerHTML = opts.checkpoints.map(c => `<option value="${esc(c.value)}">${esc(c.label)}</option>`).join("");
  $("spec").innerHTML = opts.specs.map(s => `<option ${s === opts.default_spec ? "selected" : ""}>${esc(s)}</option>`).join("");
  $("task").value = opts.task;
  $("legend").innerHTML = NAMES.map((n, i) => `<span><i style="background:${COLORS[i]}"></i>${n}</span>`).join("") +
    `<span>last 10 s of actions (model units)</span>`;
  if (!opts.vla_python) $("model-info").innerHTML = `<span class="bad">No Python with lerobot found: set NEIL_VLA_PYTHON.</span>`;
  poll();
}

async function poll() {
  try { S = await (await fetch("/api/state")).json(); render(); }
  catch (e) { $("pills").innerHTML = pill("<b>GUI backend not reachable</b>", "bad"); }
  setTimeout(poll, 200);
}
init();
</script>
</body>
</html>
