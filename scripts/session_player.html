<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Player</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --line: #e2e1dc; --text: #1d1d1b; --muted: #6d6c66;
  --accent: #2f5fd0; --ok: #1f8a4c; --ok-bg: #e3f3e9; --bad: #c0392b; --bad-bg: #fbe6e3;
  --none: #8a8981; --none-bg: #ecebe6; --video: #111;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --line: #33332f; --text: #ecebe6; --muted: #9b9a93;
    --accent: #7ea2ff; --ok: #5fcf8c; --ok-bg: #1c3326; --bad: #ff7d6e; --bad-bg: #3a201c;
    --none: #8a8981; --none-bg: #2a2a27; --video: #000; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; display: flex; }
aside { width: 300px; flex: none; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
aside header { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
aside h1 { font-size: 15px; margin: 0 0 8px; }
.stats { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.filters button.on { background: var(--text); color: var(--panel); border-color: var(--text); }
#list { overflow-y: auto; flex: 1; padding: 6px 0 20px; }
.group { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 12px 14px 4px; }
.item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
.item:hover { background: var(--bg); }
.item.sel { background: var(--bg); box-shadow: inset 3px 0 var(--accent); }
.item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--none); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.item .cat { font-size: 11px; color: var(--muted); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 22px 30px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.top h2 { margin: 0; font-size: 18px; font-variant-numeric: tabular-nums; }
.top .sub { color: var(--muted); font-size: 12px; }
.badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--none-bg); color: var(--none); }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.bad { background: var(--bad-bg); color: var(--bad); }
.nav { margin-left: auto; display: flex; gap: 6px; }
button.b { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
button.b:hover { border-color: var(--muted); }
button.b:disabled { opacity: .5; cursor: default; }
.cams { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; }
.cam { background: var(--video); border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 16/9; }
.cam.front { aspect-ratio: 4/3; }
.cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
.cam .lbl { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 11px; background: rgba(0,0,0,.5); padding: 2px 7px; border-radius: 4px; }
.controls { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; }
.time { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 120px; color: var(--muted); }
.track { position: relative; flex: 1; height: 28px; }
.track input { width: 100%; margin: 0; position: absolute; top: 6px; accent-color: var(--accent); }
.tick { position: absolute; top: 0; width: 2px; height: 7px; background: var(--muted); opacity: .6; }
.tick.key { background: var(--accent); opacity: 1; height: 9px; width: 3px; }
select { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 5px; }
.readout { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 14px; }
.loading { font-size: 12px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card h3 { margin: 0 0 8px; font-size: 14px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.reason { margin: 10px 0 0; font-size: 14px; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; }
.empty { color: var(--muted); }
a { color: var(--accent); }
.keys { color: var(--muted); font-size: 11px; margin-top: 14px; }
@media (max-width: 800px) {
  body { flex-direction: column; height: auto; }
  aside { width: 100%; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 14px 16px; }
  .cams { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<aside>
  <header>
    <h1>Session Player</h1>
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters">
      <button data-f="all" class="on">All</button>
      <button data-f="ok">Success</button>
      <button data-f="bad">Failure</button>
      <button data-f="none">Not classified</button>
    </div>
  </header>
  <div id="list"></div>
</aside>
<main>
  <div class="top">
    <h2 id="title">Loading…</h2>
    <span class="badge" id="badge"></span>
    <span class="sub" id="sub"></span>
    <div class="nav">
      <button class="b" id="prev" title="Previous (↑ or p)">◀ Prev</button>
      <button class="b" id="next" title="Next (↓ or n)">Next ▶</button>
    </div>
  </div>
  <div class="cams" id="cams"></div>
  <div class="controls">
    <button class="b" id="play" style="min-width:76px">▶ Play</button>
    <div class="time" id="time"></div>
    <div class="track" id="track"><input type="range" id="scrub" min="0" value="0"></div>
    <select id="speed" title="Playback speed">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
    </select>
    <label class="sub" style="white-space:nowrap"><input type="checkbox" id="auto"> auto-next</label>
  </div>
  <div class="readout" id="readout"></div>
  <div class="card" id="verdict"></div>
  <div class="keys">Space play/pause · ←/→ one step · shift+←/→ one second · ↑/↓ or p/n previous/next · ticks on the bar mark the frames the classifier sees, the blue one its key frame</div>
</main>
<script>
const $ = id => document.getElementById(id);
let all = [], shown = [], filter = "all", cur = null, step = 0, playing = false, timer = null, imgs = {};

const cls = v => !v ? "none" : v.success ? "ok" : "bad";
const tAt = i => cur.times && cur.times.length > i ? cur.times[i] : i / cur.fps;
const stepAt = sec => { let best = 0; for (let i = 0; i < cur.n_steps; i++) if (Math.abs(tAt(i) - sec) < Math.abs(tAt(best) - sec)) best = i; return best; };
const verdictText = v => !v ? "Not classified" : v.success ? "Success" : "Failure";

async function loadList(keepId) {
  all = await (await fetch("/api/attempts")).json();
  renderList();
  const start = keepId ?? (shown[0] || all[0]).id;
  if (cur === null || keepId !== undefined) await open(start);
}

function renderList() {
  shown = all.filter(a => filter === "all" || cls(a.verdict) === filter);
  const judged = all.filter(a => a.verdict), ok = judged.filter(a => a.verdict.success).length;
  $("stats").textContent = `${all.length} attempts · ${judged.length} classified` +
    (judged.length ? ` · ${ok} succeeded (${Math.round(100 * ok / judged.length)}%)` : "");
  const list = $("list"); list.innerHTML = "";
  let group = null;
  for (const a of shown) {
    if (a.group !== group) {
      group = a.group;
      const g = document.createElement("div"); g.className = "group"; g.textContent = group; list.appendChild(g);
    }
    const el = document.createElement("div");
    el.className = "item" + (cur && a.id === cur.id ? " sel" : "");
    el.innerHTML = `<span class="dot ${cls(a.verdict)}"></span><span class="nm"></span><span class="cat"></span>`;
    el.querySelector(".nm").textContent = a.name.replace(/^session_/, "");
    el.querySelector(".cat").textContent = a.verdict && !a.verdict.success ? a.verdict.failure_category : "";
    el.title = a.path;
    el.onclick = () => open(a.id);
    el.dataset.id = a.id;
    list.appendChild(el);
  }
  if (!shown.length) list.innerHTML = '<div class="group">Nothing here</div>';
}

async function open(id) {
  pause();
  $("title").textContent = "Loading…";
  cur = await (await fetch(`/api/attempt/${id}`)).json();
  step = 0;
  document.querySelectorAll(".item").forEach(e => e.classList.toggle("sel", +e.dataset.id === id));
  document.querySelector(`.item[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
  $("title").textContent = cur.name;
  $("sub").textContent = `${cur.group} · ${cur.kind} · ${tAt(cur.n_steps - 1).toFixed(1)} s · ${cur.n_steps} steps · "${cur.task}"`;
  const cams = $("cams"); cams.innerHTML = ""; imgs = {};
  for (const c of cur.cameras) {
    const d = document.createElement("div"); d.className = "cam " + c;
    d.innerHTML = `<img alt="${c} camera"><span class="lbl">${c === "top" ? "top camera" : "robot camera"}</span>`;
    cams.appendChild(d); imgs[c] = d.querySelector("img");
  }
  $("scrub").max = cur.n_steps - 1;
  drawTicks(); renderVerdict(); show(0); preload();
}

function preload() {   // warm the browser cache so playback is smooth
  const id = cur.id;
  let i = 0;
  const next = () => {
    if (!cur || cur.id !== id || i >= cur.n_steps) return;
    const batch = [];
    for (let k = 0; k < 10 && i < cur.n_steps; k++, i++)
      for (const c of cur.cameras) { const im = new Image(); im.src = `/frame/${id}/${c}/${i}.jpg`; batch.push(im.decode().catch(() => {})); }
    Promise.all(batch).then(next);
  };
  next();
}

function drawTicks() {
  document.querySelectorAll(".tick").forEach(t => t.remove());
  const n = Math.max(1, cur.n_steps - 1), v = cur.verdict;
  const key = v && typeof v.key_frame_s === "number" ? stepAt(v.key_frame_s) : null;
  for (const s of cur.sampled) addTick(s, n, false);
  if (key !== null) addTick(key, n, true);
}
function addTick(s, n, key) {
  const t = document.createElement("div"); t.className = "tick" + (key ? " key" : "");
  t.style.left = `calc(${(100 * s / n).toFixed(2)}% - ${key ? 1.5 : 1}px)`;
  t.title = key ? "classifier's key frame" : "frame sent to the classifier";
  $("track").appendChild(t);
}

function show(i) {
  step = Math.max(0, Math.min(cur.n_steps - 1, i));
  for (const c of cur.cameras) imgs[c].src = `/frame/${cur.id}/${c}/${step}.jpg`;
  $("scrub").value = step;
  $("time").textContent = `${tAt(step).toFixed(1)} / ${tAt(cur.n_steps - 1).toFixed(1)} s · step ${step}`;
  const f = v => v === null || v === undefined ? "–" : v;
  $("readout").textContent = `arm ${f(cur.arm[step])}° (+ lowered)   gripper ${f(cur.grip[step])}° (+ opened)`;
}

function renderVerdict() {
  const v = cur.verdict, b = $("badge");
  b.className = "badge " + cls(v); b.textContent = verdictText(v);
  const card = $("verdict");
  const label = cur.label === null || cur.label === undefined ? "" :
    `<dt>Recorded label</dt><dd>${cur.label ? "success" : "failure"}${v ? (v.success === cur.label ? " (agrees)" : " (disagrees)") : ""}</dd>`;
  if (!v) {
    card.innerHTML = `<h3>Classifier</h3><p class="empty">Not classified yet.</p>${label ? `<dl class="kv">${label}</dl>` : ""}
      <button class="b" id="classify">Classify this attempt</button><div class="err" id="err"></div>`;
  } else {
    card.innerHTML = `<h3>Classifier: ${verdictText(v)}</h3>
      <dl class="kv">
        <dt>Confidence</dt><dd>${Math.round(v.confidence * 100)}%</dd>
        ${v.success ? "" : `<dt>Failure</dt><dd>${esc(v.failure_category)}</dd>`}
        <dt>Cup at the end</dt><dd>${esc((v.cup_final_state || "").replace(/_/g, " "))}</dd>
        <dt>Key moment</dt><dd><a href="#" id="jump">${(+v.key_frame_s).toFixed(1)} s</a></dd>
        ${label}
        <dt>Model</dt><dd>${esc(v.model || "")}</dd>
      </dl>
      <p class="reason">${esc(v.reason)}</p>
      <button class="b" id="classify" style="margin-top:10px">Classify again</button><div class="err" id="err"></div>`;
    $("jump").onclick = e => { e.preventDefault(); pause(); show(stepAt(v.key_frame_s)); };
  }
  $("classify").onclick = classifyNow;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function classifyNow() {
  const btn = $("classify"), id = cur.id;
  btn.disabled = true; btn.textContent = "Classifying…"; $("err").textContent = "";
  const r = await (await fetch(`/api/classify/${id}`, { method: "POST" })).json();
  if (r.error) { btn.disabled = false; btn.textContent = "Classify this attempt"; $("err").textContent = r.error; return; }
  await loadList(id);
}

function play() {
  if (!cur) return;
  if (step >= cur.n_steps - 1) show(0);
  playing = true; $("play").textContent = "❚❚ Pause";
  const tick = () => {
    if (!playing) return;
    if (step >= cur.n_steps - 1) {
      pause();
      if ($("auto").checked) go(1, true);
      return;
    }
    show(step + 1);
    timer = setTimeout(tick, 1000 / (cur.fps * +$("speed").value));
  };
  timer = setTimeout(tick, 1000 / (cur.fps * +$("speed").value));
}
function pause() { playing = false; clearTimeout(timer); $("play").textContent = "▶ Play"; }
async function go(d, autoplay) {
  const list = shown.length ? shown : all;
  const i = list.findIndex(a => a.id === cur.id);
  const n = list[(i + d + list.length) % list.length];
  if (n) { await open(n.id); if (autoplay) play(); }
}

$("play").onclick = () => playing ? pause() : play();
$("scrub").oninput = e => { pause(); show(+e.target.value); };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("filters").onclick = e => {
  const f = e.target.dataset.f; if (!f) return;
  filter = f;
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b.dataset.f === f));
  renderList();
};
document.addEventListener("keydown", e => {
  if (!cur || e.target.tagName === "INPUT" && e.target.type !== "range" || e.target.tagName === "SELECT") return;
  const big = e.shiftKey ? Math.round(cur.fps) : 1;
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); pause(); show(step + big); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); pause(); show(step - big); }
  else if (e.key === "ArrowDown" || e.key === "n") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowUp" || e.key === "p") { e.preventDefault(); go(-1); }
});
loadList();
</script>
</body>
</html>
